name: PulseGrid CI

on:
  push:
    branches: [main, 'cursor/**']
    paths: ['pulsegrid/**']
  pull_request:
    branches: [main]
    paths: ['pulsegrid/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsegrid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check pulsegrid tests

      - name: Test
        run: pytest -v --cov=pulsegrid --cov-report=term-missing

      - name: RAG eval gate
        run: python scripts/eval_rag.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: pulsegrid

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t pulsegrid-api .

      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t pulsegrid-worker .
