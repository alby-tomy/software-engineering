apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid-api
  labels:
    app: pulsegrid-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsegrid-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pulsegrid-api
    spec:
      containers:
        - name: api
          image: pulsegrid-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulsegrid-config
            - secretRef:
                name: pulsegrid-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid-api
spec:
  selector:
    app: pulsegrid-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsegrid-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsegrid-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
